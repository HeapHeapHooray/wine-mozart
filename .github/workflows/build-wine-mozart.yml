name: build-wine-mozart
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PKG_BASENAME: 'wine-mozart'
  WINE_VERSION: '11.0'

jobs:
  build:
    name: 🍷 Build & Release wine-mozart
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache mingw-w64 bison flex autoconf perl gettext \
            libfreetype-dev libfontconfig-dev libpng-dev libjpeg-dev \
            libgif-dev libgnutls28-dev libasound2-dev libpulse-dev \
            libxcomposite-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxinerama-dev libvulkan-dev libgl-dev libegl-dev

      - name: 🧩 Fetch base patches (wine-d2d1-msi)
        run: |
          chmod +x build.sh
          ./build.sh --fetch-patches

      - name: 🍷 Fetch base Wine (giang17)
        run: ./build.sh --fetch-wine

      - name: 🩹 Apply base & custom patches
        run: ./build.sh --apply-patches

      - name: ⚙️ Configure Wine (WoW64)
        run: ./build.sh --configure

      - name: 🔨 Compile Wine runner
        run: ./build.sh --build

      - name: 📦 Package runner archive
        run: ./build.sh --package

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', env.PKG_BASENAME, env.WINE_VERSION) }}"
          name: "${{ github.ref_type == 'tag' && format('wine-mozart {0}', github.ref_name) || format('wine-mozart {0}-{1}', env.PKG_BASENAME, env.WINE_VERSION) }}"
          draft: false
          prerelease: false
          files: "dist/${{ env.PKG_BASENAME }}-${{ env.WINE_VERSION }}-x86_64.tar.xz"
